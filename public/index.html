<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LCT ComfyUI 모듈</title>
<style>
  @font-face { font-family: 'Pretendard'; src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/pretendard@1.0/Pretendard-Thin.woff2') format('woff2'); font-weight: 100; font-display: swap; }
  @font-face { font-family: 'Pretendard'; src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/pretendard@1.0/Pretendard-ExtraLight.woff2') format('woff2'); font-weight: 200; font-display: swap; }
  @font-face { font-family: 'Pretendard'; src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/pretendard@1.0/Pretendard-Light.woff2') format('woff2'); font-weight: 300; font-display: swap; }
  @font-face { font-family: 'Pretendard'; src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/pretendard@1.0/Pretendard-Regular.woff2') format('woff2'); font-weight: 400; font-display: swap; }
  @font-face { font-family: 'Pretendard'; src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/pretendard@1.0/Pretendard-Medium.woff2') format('woff2'); font-weight: 500; font-display: swap; }
  @font-face { font-family: 'Pretendard'; src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/pretendard@1.0/Pretendard-SemiBold.woff2') format('woff2'); font-weight: 600; font-display: swap; }
  @font-face { font-family: 'Pretendard'; src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/pretendard@1.0/Pretendard-Bold.woff2') format('woff2'); font-weight: 700; font-display: swap; }
  @font-face { font-family: 'Pretendard'; src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/pretendard@1.0/Pretendard-ExtraBold.woff2') format('woff2'); font-weight: 800; font-display: swap; }
  @font-face { font-family: 'Pretendard'; src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/pretendard@1.0/Pretendard-Black.woff2') format('woff2'); font-weight: 900; font-display: swap; }

  :root {
    --bg: #111111;
    --surface: #1a1a1a;
    --surface2: #222222;
    --border: #2e2e2e;
    --accent: #eefd41;
    --accent2: #b8c930;
    --text: #e8e4dc;
    --muted: #6b6760;
    --danger: #e05252;
    --success: #52b788;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Pretendard', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Grain overlay */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.035'/%3E%3C/svg%3E");
    pointer-events: none; z-index: 9999; opacity: 0.4;
  }

  header {
    padding: 2rem 3rem;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: baseline; gap: 1rem;
  }
  header h1 {
    font-size: 1.4rem; font-weight: 700; letter-spacing: 0.04em;
    color: var(--accent); font-family: 'Pretendard', sans-serif;
  }
  header span {
    font-family: 'Pretendard', sans-serif; font-weight: 300;
    font-size: 0.7rem; color: var(--muted); letter-spacing: 0.2em;
  }

  .container {
    max-width: 1100px; margin: 0 auto; padding: 3rem 2rem;
    display: grid; gap: 2.5rem;
  }

  /* ── API Key ── */
  .api-row {
    display: flex; gap: 1rem; align-items: center;
  }
  .api-row label {
    font-family: 'Pretendard', sans-serif; font-weight: 500; font-size: 0.75rem;
    letter-spacing: 0.12em; color: var(--muted); white-space: nowrap;
  }
  .api-row input {
    flex: 1;
    background: var(--surface); border: 1px solid var(--border);
    color: var(--text); padding: 0.7rem 1rem;
    font-family: 'Pretendard', sans-serif; font-size: 0.85rem;
    outline: none; transition: border-color 0.2s;
  }
  .api-row input:focus { border-color: var(--accent2); }

  /* ── Main grid ── */
  .main-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 2rem;
    align-items: start;
  }

  /* ── Upload zone ── */
  .upload-zone {
    border: 1px dashed var(--border);
    aspect-ratio: 3/4; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 1rem;
    cursor: pointer; transition: border-color 0.2s, background 0.2s;
    position: relative; overflow: hidden;
    background: var(--surface);
  }
  .upload-zone:hover { border-color: var(--accent2); background: var(--surface2); }
  .upload-zone.dragover { border-color: var(--accent); background: #1e2000; }
  .upload-zone input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .upload-zone img {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover;
  }
  .upload-zone .upload-hint {
    font-family: 'Pretendard', sans-serif; font-weight: 300; font-size: 0.78rem;
    letter-spacing: 0.08em; color: var(--muted); text-align: center;
    line-height: 2; z-index: 1;
  }
  .upload-zone .upload-icon {
    font-size: 2rem; color: var(--border); z-index: 1;
  }
  .upload-overlay {
    position: absolute; inset: 0; background: rgba(10,10,11,0.6);
    display: flex; align-items: center; justify-content: center;
    z-index: 2;
  }
  .upload-overlay span {
    font-family: 'Pretendard', sans-serif; font-weight: 500; font-size: 0.75rem;
    letter-spacing: 0.15em; color: var(--accent);
    border: 1px solid var(--accent2); padding: 0.4rem 0.8rem;
  }

  /* ── Expression grid ── */
  .expr-panel {
    display: flex; flex-direction: column; gap: 1.2rem;
  }
  .expr-section-label {
    font-family: 'Pretendard', sans-serif; font-weight: 500; font-size: 0.68rem;
    letter-spacing: 0.18em; color: var(--muted);
    border-bottom: 1px solid var(--border); padding-bottom: 0.5rem;
  }
  .expr-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem;
  }
  .expr-btn {
    background: var(--surface); border: 1px solid var(--border);
    color: var(--text); padding: 0.65rem 0.8rem;
    font-family: 'Pretendard', sans-serif; font-weight: 400; font-size: 0.82rem;
    cursor: pointer; text-align: left; transition: all 0.15s;
    line-height: 1.4;
  }
  .expr-btn:hover { background: var(--accent2); border-color: var(--accent2); color: #fff; }
  .expr-btn.selected {
    border-color: var(--accent); background: var(--accent);
    color: #111111; font-weight: 600;
  }
  .expr-btn .en {
    font-family: 'Pretendard', sans-serif; font-weight: 300; font-size: 0.63rem;
    color: inherit; opacity: 0.7; display: block; margin-top: 0.2rem;
  }

  /* ── Generate button ── */
  .generate-btn {
    width: 100%; padding: 1rem;
    background: transparent; border: 1px solid var(--accent);
    color: var(--accent); font-family: 'Pretendard', sans-serif;
    font-weight: 600; font-size: 0.85rem; letter-spacing: 0.15em;
    cursor: pointer; transition: all 0.2s;
    text-transform: uppercase;
  }
  .generate-btn:hover:not(:disabled) {
    background: var(--accent); color: #111111;
  }
  .generate-btn:disabled {
    border-color: var(--border); color: var(--muted); cursor: not-allowed;
  }

  /* ── Status ── */
  .status-bar {
    font-family: 'Pretendard', sans-serif; font-weight: 400; font-size: 0.78rem;
    letter-spacing: 0.05em; padding: 0.8rem 1rem;
    border: 1px solid var(--border); background: var(--surface);
    display: none;
  }
  .status-bar.visible { display: block; }
  .status-bar.error { border-color: var(--danger); color: var(--danger); }
  .status-bar.success { border-color: var(--success); color: var(--success); }

  /* ── Results ── */
  .results {
    display: none; gap: 1.5rem;
  }
  .results.visible { display: grid; grid-template-columns: 1fr 1fr; }
  .result-card {
    background: var(--surface); border: 1px solid var(--border);
  }
  .result-card img {
    width: 100%; display: block;
  }
  .result-label {
    padding: 0.6rem 0.8rem;
    font-family: 'Pretendard', sans-serif; font-weight: 500; font-size: 0.7rem;
    letter-spacing: 0.12em; color: var(--muted);
    border-top: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center;
  }
  .download-btn {
    background: none; border: none; color: var(--accent2);
    font-family: 'Pretendard', sans-serif; font-weight: 500; font-size: 0.7rem;
    cursor: pointer; letter-spacing: 0.08em; transition: color 0.15s;
  }
  .download-btn:hover { color: var(--accent); }

  /* ── Spinner ── */
  @keyframes spin { to { transform: rotate(360deg); } }
  .spinner {
    display: inline-block; width: 10px; height: 10px;
    border: 1px solid var(--muted); border-top-color: var(--accent);
    border-radius: 50%; animation: spin 0.8s linear infinite;
    margin-right: 0.5rem; vertical-align: middle;
  }


  /* ── Tabs ── */
  .tabs {
    display: flex; gap: 0; border-bottom: 1px solid var(--border);
  }
  .tab-btn {
    background: transparent; border: none; border-bottom: 2px solid transparent;
    color: var(--muted); font-family: 'Pretendard', sans-serif;
    font-weight: 500; font-size: 0.85rem; letter-spacing: 0.08em;
    padding: 0.7rem 1.4rem; cursor: pointer; transition: all 0.15s;
    margin-bottom: -1px;
  }
  .tab-btn:hover { color: var(--text); }
  .tab-btn.active {
    color: var(--accent); border-bottom-color: var(--accent);
    font-weight: 700;
  }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  /* 앵글 그리드 */
  .angle-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem;
  }
  .angle-btn {
    background: var(--surface); border: 1px solid var(--border);
    color: var(--text); padding: 0.7rem 0.5rem;
    font-family: 'Pretendard', sans-serif; font-weight: 400; font-size: 0.82rem;
    cursor: pointer; text-align: center; transition: all 0.15s; line-height: 1.4;
  }
  .angle-btn:hover { background: var(--accent2); border-color: var(--accent2); color: #fff; }
  .angle-btn.selected {
    border-color: var(--accent); background: var(--accent);
    color: #111111; font-weight: 600;
  }
  .angle-btn .en {
    font-family: 'Pretendard', sans-serif; font-weight: 300; font-size: 0.63rem;
    opacity: 0.7; display: block; margin-top: 0.2rem;
  }

  /* 포즈 빈 화면 */
  .coming-soon {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 0.8rem; height: 100%; min-height: 200px; color: var(--muted);
    border: 1px dashed var(--border); font-family: 'Pretendard', sans-serif;
  }
  .coming-soon span { font-size: 0.75rem; letter-spacing: 0.15em; }

  /* 다른 탭에서 업로드존 자리 확보 */
  .upload-zone-mirror {
    aspect-ratio: 3/4; background: var(--surface);
    border: 1px dashed var(--border);
    position: relative; overflow: hidden;
    cursor: pointer; transition: border-color 0.2s, background 0.2s;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 1rem;
  }
  .upload-zone-mirror:hover { border-color: var(--accent2); background: var(--surface2); }
  .upload-zone-mirror.dragover { border-color: var(--accent); background: #1e2000; }
  .upload-zone-mirror img {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
  }
  .upload-zone-mirror .upload-hint {
    font-family: 'Pretendard', sans-serif; font-weight: 300; font-size: 0.78rem;
    letter-spacing: 0.08em; color: var(--muted); text-align: center;
    line-height: 2; z-index: 1;
  }
  .upload-zone-mirror .upload-icon {
    font-size: 2rem; color: var(--border); z-index: 1;
  }

  @media (max-width: 700px) {
    .main-grid { grid-template-columns: 1fr; }
    .results.visible { grid-template-columns: 1fr; }
    header { padding: 1.5rem; }
    .container { padding: 1.5rem 1rem; }
  }
</style>
</head>
<body>
<header>
  <h1>LCT ComfyUI 모듈</h1>
  <span>COMFYUI CLOUD · LCT MODULE</span>
</header>

<div class="container">
<!-- Tabs -->
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('expr', this)">표정</button>
    <button class="tab-btn" onclick="switchTab('angle', this)">앵글</button>
    <button class="tab-btn" onclick="switchTab('pose', this)">포즈</button>
  </div>

  <!-- Upload (공통) -->

  <!-- 표정 탭 -->
  <div class="tab-panel active" id="panel-expr">
    <div class="main-grid">
      <div class="upload-zone" id="uploadZone">
        <input type="file" id="fileInput" accept="image/*">
        <div class="upload-icon">⊕</div>
        <div class="upload-hint">
          이미지를 드래그하거나<br>클릭해서 업로드<br><br>
          <span style="font-size:0.6rem">JPG · PNG · WEBP · 최대 50MB</span>
        </div>
      </div>
      <div class="expr-panel" id="exprPanel">
        <div>
          <div class="expr-section-label">부정적인</div>
          <div class="expr-grid" id="grid35"></div>
        </div>
        <div>
          <div class="expr-section-label">긍정적인</div>
          <div class="expr-grid" id="grid36"></div>
        </div>
        <div>
          <div class="expr-section-label">기타</div>
          <div class="expr-grid" id="grid38"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- 앵글 탭 -->
  <div class="tab-panel" id="panel-angle">
    <div class="main-grid">
      <div class="upload-zone-mirror" id="mirrorAngle">
        <div class="upload-icon">⊕</div>
        <div class="upload-hint">이미지를 드래그하거나<br>클릭해서 업로드<br><br><span style="font-size:0.6rem">JPG · PNG · WEBP · 최대 50MB</span></div>
      </div>
      <div class="expr-panel" id="anglePanel">
        <div>
          <div class="expr-section-label">후면</div>
          <div class="expr-grid" id="angle-back"></div>
        </div>
        <div>
          <div class="expr-section-label">측면</div>
          <div class="expr-grid" id="angle-side"></div>
        </div>
        <div>
          <div class="expr-section-label">기타</div>
          <div class="expr-grid" id="angle-etc"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- 포즈 탭 -->
  <div class="tab-panel" id="panel-pose">
    <div class="main-grid">
      <div class="upload-zone-mirror"></div>
      <div class="coming-soon">
        <span style="font-size:1.5rem; opacity:0.3">✦</span>
        <span>COMING SOON</span>
      </div>
    </div>
  </div>

  <!-- Generate -->
  <button class="generate-btn" id="generateBtn" disabled>GENERATE</button>

  <!-- Status -->
  <div class="status-bar" id="statusBar"></div>

  <!-- 표정 결과 (2장) -->
  <div class="results" id="results-expr">
    <div class="result-card">
      <img id="resultFull" src="" alt="전신 표정 변경">
      <div class="result-label">
        <span>FULL IMAGE</span>
        <button class="download-btn" onclick="downloadImg('resultFull','full.jpg')">SAVE ↓</button>
      </div>
    </div>
    <div class="result-card">
      <img id="resultFace" src="" alt="얼굴 클로즈업">
      <div class="result-label">
        <span>FACE CLOSE-UP</span>
        <button class="download-btn" onclick="downloadImg('resultFace','face.jpg')">SAVE ↓</button>
      </div>
    </div>
  </div>

  <!-- 앵글 결과 (1장) -->
  <div class="results" id="results-angle" style="grid-template-columns:1fr; max-width:600px;">
    <div class="result-card">
      <img id="resultAngle" src="" alt="앵글 변환 결과">
      <div class="result-label">
        <span>ANGLE RESULT</span>
        <button class="download-btn" onclick="downloadImg('resultAngle','angle.jpg')">SAVE ↓</button>
      </div>
    </div>
  </div>

</div>

 3(윙크)\n\n\n## 얼굴 확대는 필요한 경우만 켜서 사용\n\n**04. Image Crop Face**\n- crop_padding_factor 너무 꽉 차게 잘렸다면 수치 살짝 올려보기\n- haarcascade_frontalface_default.xml 표준적인 정면 얼굴일 때\n- haarcascade_frontalface_alt2.xml,alt 살짝 고개를 틀거나 앞머리가 길어서 이마와 눈썹을 덮고 있는 경우\n- haarcascade_frontalface_alt_tree.xml 다른곳을 계속 크롭할 때\n- haarcascade_profileface.xml 옆모습 전용\n- lbpcascade_animeface.xml 2D, 만화 캐릭터용\n- haarcascade_upperbody.xml 어깨, 상반식까지 넉넉하게 크롭할 때\n\n\n**05. 체크포인트 로드**\n\n- 아시아인 실사용 → majicMIX realistic, Japanese Style Realistic\n- 서양인,고화질용 → RealVisXL V5.0, ICBINP, Realism By Stable Yogi\n- 2D 애니메이션 → CarDos Anime, AWPainting\n\n**06. CLIP 텍스트 인코딩(프롬프트)**\n\n- 긍정 조건, 부정 조건에 대한 프롬프트가 작성되어 있음\n- 원하는 표정에 맞춘 프롬프트로 변경해서 사용 권장 (예: 윙크 표정시 긍정 프롬프트에 winking, one eye closed 추가)\n\n**07. KSampler**\n\n- AI가 얼굴을 못 찾는다 → 시드값 올리거나 내려보기\n\n- 얼굴이 딴 사람처럼 변한다 → 노이즈 제거양 낮추기\n\n**08. 실행**\n\n- 우측 상단 실행 버튼\n- 단축키 Ctrl+Enter\n"],"color":"#432","bgcolor":"#000"},{"id":40,"type":"GeminiNanoBanana2","pos":[-790,2350],"size":[400,372],"flags":{},"order":19,"mode":0,"inputs":[{"name":"images","shape":7,"type":"IMAGE","link":86},{"name":"files","shape":7,"type":"GEMINI_INPUT_FILES","link":null}],"outputs":[{"name":"IMAGE","type":"IMAGE","links":[]},{"name":"STRING","type":"STRING","links":null}],"properties":{"Node name for S&R":"GeminiNanoBanana2"},"widgets_values":["Edit the provided image. Keep the same person, identity, hairstyle, clothing, pose, lighting, background, and composition exactly the same. Only adjust the person's facial expression to a playful relaxed smile. Keep the expression subtle and realistic.","Nano Banana 2 (Gemini 3.1 Flash Image)",1118088500411651,"randomize","4:5","2K","IMAGE","MINIMAL","You are an expert image-generation engine. You must ALWAYS produce an image.\nInterpret all user input—regardless of format, intent, or abstraction—as literal visual directives for image composition.\nIf a prompt is conversational or lacks specific visual details, you must creatively invent a concrete visual sc // ── Upload ──
const zone = document.getElementById('uploadZone');
const fileInput = document.getElementById('fileInput');

zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('dragover'); });
zone.addEventListener('dragleave', () => zone.classList.remove('dragover'));
zone.addEventListener('drop', e => {
  e.preventDefault(); zone.classList.remove('dragover');
  const f = e.dataTransfer.files[0];
  if (f) handleFile(f);
});
fileInput.addEventListener('change', () => {
  if (fileInput.files[0]) handleFile(fileInput.files[0]);
});

function handleFile(f) {
  previewFile = f;
  const reader = new FileReader();
  reader.onload = ev => {
    let img = zone.querySelector('img');
    if (!img) { img = document.createElement('img'); zone.appendChild(img); }
    img.src = ev.target.result;
    syncMirrors(ev.target.result);
    let overlay = zone.querySelector('.upload-overlay');
    if (!overlay) {
      overlay = document.createElement('div');
      overlay.className = 'upload-overlay';
      overlay.innerHTML = '<span>이미지 변경</span>';
      overlay.style.cursor = 'pointer';
      overlay.addEventListener('click', (e) => { e.stopPropagation(); fileInput.click(); });
      zone.appendChild(overlay);
    }
  };
  reader.readAsDataURL(f);
  uploadedFilename = null; // reset, re-upload needed
  checkReady();
}

function syncMirrors(src) {
  document.querySelectorAll('.upload-zone-mirror').forEach(m => {
    const hint = m.querySelector('.upload-hint');
    const icon = m.querySelector('.upload-icon');
    if (hint) hint.style.display = 'none';
    if (icon) icon.style.display = 'none';
    let img = m.querySelector('img');
    if (!img) { img = document.createElement('img'); m.appendChild(img); }
    img.src = src;
    let overlay = m.querySelector('.upload-overlay');
    if (!overlay) {
      overlay = document.createElement('div');
      overlay.className = 'upload-overlay';
      overlay.innerHTML = '<span>이미지 변경</span>';
      overlay.addEventListener('click', e => { e.stopPropagation(); document.getElementById('fileInput').click(); });
      m.appendChild(overlay);
    }
  });
}

  const bar = document.getElementById('statusBar');
  bar.className = 'status-bar visible' + (type ? ' '+type : '');
  bar.innerHTML = type === 'pending'
    ? `<span class="spinner"></span>${msg}`
    : msg;
}

// ── Generate ──
// XHR 기반 파일 업로드 (FormData postMessage 오류 방지)
function uploadImageXHR(file, apiKey) {
  return new Promise((resolve, reject) => {
    const formData = new FormData();
    formData.append('image', file);
    formData.append('type', 'input');
    const xhr = new XMLHttpRequest();
    xhr.open('POST', `${API_BASE}/api/upload/image`);
    xhr.setRequestHeader('X-API-Key', apiKey);
    xhr.onload = () => {
      if (xhr.status >= 200 && xhr.status < 300) {
        resolve(JSON.parse(xhr.responseText));
      } else {
        reject(new Error(`업로드 실패 ${xhr.status}: ${xhr.responseText.slice(0, 200)}`));
      }
    };
    xhr.onerror = () => reject(new Error('네트워크 오류'));
    xhr.send(formData);
  });
}

document.getElementById('generateBtn').onclick = async () => {
  if (currentTab === 'angle') { await generateAngle(); return; }
  const apiKey = API_KEY;

  document.getElementById('generateBtn').disabled = true;
  document.getElementById('results-expr').classList.remove('visible');
    document.getElementById('results-angle').classList.remove('visible');

  try {
    // 1. Upload image
    setStatus('이미지 업로드 중...', 'pending');
    const upData = await uploadImageXHR(previewFile, apiKey);
    const filename = upData.name;

    // 2. Build modified workflow
    setStatus('워크플로우 준비 중...', 'pending');
    const wf = JSON.parse(JSON.stringify(WORKFLOW)); // deep copy
    const activeGroup = selectedExpr.sc;
    const caseIdx = selectedExpr.idx;

    wf.nodes.forEach(node => {
      // LoadImage: set uploaded filename
      if (node.id === 11) {
        node.widgets_values[0] = filename;
        return;
      }
      // SwitchCase: set case index
      if (node.id === activeGroup) {
        node.widgets_values[0] = caseIdx;
        return;
      }
      // Mute nodes from other groups
      const inactiveGroups = Object.keys(GROUP_NODES)
        .map(Number).filter(g => g !== activeGroup);
      for (const g of inactiveGroups) {
        if (GROUP_NODES[g].includes(node.id)) {
          node.mode = 4; // muted
          return;
        }
      }
    });

    // 3. Submit workflow
    setStatus('워크플로우 제출 중...', 'pending');
    const submitRes = await fetch(`${API_BASE}/api/prompt`, {
      method: 'POST',
      headers: {
        'X-API-Key': apiKey,
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({
        prompt: {},
        extra_data: { extra_pnginfo: { workflow: wf } },
      }),
    });
    if (!submitRes.ok) {
      const err = await submitRes.text();
      throw new Error(`제출 실패 (${submitRes.status}): ${err}`);
    }
    const submitData = await submitRes.json();
    const promptId = submitData.prompt_id;

    // 4. Poll status
    setStatus(`생성 중... (ID: ${promptId.slice(0,8)}...)`, 'pending');
    let done = false;
    while (!done) {
      await new Promise(r => setTimeout(r, 3000));
      const statusRes = await fetch(`${API_BASE}/api/job/${promptId}/status`, {
        headers: { 'X-API-Key': apiKey },
      });
      if (!statusRes.ok) continue;
      const statusData = await statusRes.json();
      const s = statusData.status;

      if (s === 'completed') { done = true; }
      else if (s === 'error') { throw new Error(`실행 오류: ${statusData.error_message}`); }
      else if (s === 'cancelled') { throw new Error('작업이 취소되었습니다.'); }
      else { setStatus(`${s === 'in_progress' ? '처리 중' : '대기 중'}... (${s})`, 'pending'); }
    }

    // 5. Get results
    setStatus('결과 가져오는 중...', 'pending');
    const histRes = await fetch(`${API_BASE}/api/history/${promptId}`, {
      headers: { 'X-API-Key': apiKey },
    });
    if (!histRes.ok) throw new Error('결과 조회 실패');
    const histData = await histRes.json();

    // Find output images from preview nodes
    const previews = GROUP_PREVIEWS[activeGroup];
    const outputs = histData[promptId]?.outputs ?? {};

    let fullImgUrl = null, faceImgUrl = null;
    const previewNode0 = String(previews[0]);
    const previewNode1 = String(previews[1]);

    if (outputs[previewNode0]?.images?.[0]) {
      const img = outputs[previewNode0].images[0];
      fullImgUrl = `${API_BASE}/api/view?filename=${encodeURIComponent(img.filename)}&type=${img.type}&subfolder=${img.subfolder ?? ''}`;
    }
    if (outputs[previewNode1]?.images?.[0]) {
      const img = outputs[previewNode1].images[0];
      faceImgUrl = `${API_BASE}/api/view?filename=${encodeURIComponent(img.filename)}&type=${img.type}&subfolder=${img.subfolder ?? ''}`;
    }

    if (!fullImgUrl && !faceImgUrl) {
      // Fallback: show all output images
      const allImages = Object.values(outputs).flatMap(o => o.images ?? []);
      if (allImages[0]) {
        const img = allImages[0];
        fullImgUrl = `${API_BASE}/api/view?filename=${encodeURIComponent(img.filename)}&type=${img.type}`;
      }
      if (allImages[1]) {
        const img = allImages[1];
        faceImgUrl = `${API_BASE}/api/view?filename=${encodeURIComponent(img.filename)}&type=${img.type}`;
      }
    }

    // Display results
    const resultFull = document.getElementById('resultFull');
    const resultFace = document.getElementById('resultFace');
    if (fullImgUrl) {
      resultFull.src = fullImgUrl;
    }
    if (faceImgUrl) {
      resultFace.src = faceImgUrl;
    }
    document.getElementById('results-expr').classList.add('visible');
    setStatus(`완료! "${selectedExpr.ko}" 표정 생성 성공`, 'success');

  } catch (e) {
    setStatus(`오류: ${e.message}`, 'error');
  } finally {
    document.getElementById('generateBtn').disabled = false;
  }
};

Object.entries(ANGLE_GROUPS).forEach(([gridId, items]) => {

async function generateAngle() {
  const apiKey = API_KEY;

  document.getElementById('generateBtn').disabled = true;
  document.getElementById('results-angle').classList.remove('visible');

  try {
    setStatus('이미지 업로드 중...', 'pending');
    const upData = await uploadImageXHR(previewFile, apiKey);
    const filename = upData.name;

    setStatus('워크플로우 준비 중...', 'pending');
    const wf = JSON.parse(JSON.stringify(ANGLE_WORKFLOW));

    // LoadImage 파일명 변경 (node id=41)
    wf.nodes.forEach(node => {
      if (node.id === 41) { node.widgets_values[0] = filename; }
      // 선택된 앵글 제외 나머지 mute
      const activeChain = ANGLE_CHAINS[selectedAngle] || [];
      if (!activeChain.includes(node.id) && node.id !== 41) {
        const allChainNodes = Object.values(ANGLE_CHAINS).flat();
        if (allChainNodes.includes(node.id)) node.mode = 4;
      }
    });

    setStatus('워크플로우 제출 중...', 'pending');
    const submitRes = await fetch(`${API_BASE}/api/prompt`, {
      method: 'POST',
      headers: { 'X-API-Key': apiKey, 'Content-Type': 'application/json' },
      body: JSON.stringify({ prompt: {}, extra_data: { extra_pnginfo: { workflow: wf } } }),
    });
    if (!submitRes.ok) {
      const err = await submitRes.text();
      throw new Error(`제출 실패 (${submitRes.status}): ${err}`);
    }
    const submitData = await submitRes.json();
    const promptId = submitData.prompt_id;

    setStatus(`생성 중... (ID: ${promptId.slice(0,8)}...)`, 'pending');
    let done = false;
    while (!done) {
      await new Promise(r => setTimeout(r, 3000));
      const sRes = await fetch(`${API_BASE}/api/job/${promptId}/status`, { headers: { 'X-API-Key': apiKey } });
      if (!sRes.ok) continue;
      const sData = await sRes.json();
      if (sData.status === 'completed') { done = true; }
      else if (sData.status === 'error') throw new Error(`실행 오류: ${sData.error_message}`);
      else if (sData.status === 'cancelled') throw new Error('작업이 취소되었습니다.');
      else setStatus(`${sData.status === 'in_progress' ? '처리 중' : '대기 중'}... (${sData.status})`, 'pending');
    }

    setStatus('결과 가져오는 중...', 'pending');
    const histRes = await fetch(`${API_BASE}/api/history/${promptId}`, { headers: { 'X-API-Key': apiKey } });
    if (!histRes.ok) throw new Error('결과 조회 실패');
    const histData = await histRes.json();
    const outputs = histData[promptId]?.outputs ?? {};
    const previewNodeId = String(ANGLE_PREVIEWS[selectedAngle]);
    let imgUrl = null;
    if (outputs[previewNodeId]?.images?.[0]) {
      const img = outputs[previewNodeId].images[0];
      imgUrl = `${API_BASE}/api/view?filename=${encodeURIComponent(img.filename)}&type=${img.type}&subfolder=${img.subfolder ?? ''}`;
    } else {
      const allImgs = Object.values(outputs).flatMap(o => o.images ?? []);
      if (allImgs[0]) imgUrl = `${API_BASE}/api/view?filename=${encodeURIComponent(allImgs[0].filename)}&type=${allImgs[0].type}`;
    }
    if (imgUrl) {
      document.getElementById('resultAngle').src = imgUrl;
      document.getElementById('results-angle').classList.add('visible');
    }
    setStatus(`완료! "${selectedAngle}" 앵글 생성 성공`, 'success');

  } catch(e) {
    setStatus(`오류: ${e.message}`, 'error');
  } finally {
    document.getElementById('generateBtn').disabled = false;
  }
}

function downloadImg(imgId, filename) {
  const img = document.getElementById(imgId);
  const a = document.createElement('a');
  a.href = img.src; a.download = filename; a.click();
}
